[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizro-genui-skill"
version = "0.1.0"
description = "GenUI skill leveraging Vizro's configuration-driven architecture for Federator.ai Cortex"
requires-python = ">=3.10"
dependencies = [
    "vizro>=0.1.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cortex = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vizro_genui"]
